# first_plant / first_mutant  plants are numbered by tray position; from first_mutant on they are SWAP A
# controls                    plants kept at normal temperature, left out of the recovery analysis
# min_baseline_area           drop plants smaller than this (cm2) before the stress: seedlings that never established
# outliers                    plants dropped after checking their photos (segmentation errors, sudden jumps in size)
# max_day                     last recovery day used for the index

